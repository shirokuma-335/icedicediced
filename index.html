<!DOCTYPE html>
<html>
<head>
<style>
  body {
    text-align: center;
    margin-top: 20px;
  }

  #pic {
    max-width: 100%;
    cursor: pointer;
  }

  .glitch {
    animation: glitch 0.5s;
  }

  @keyframes glitch {
    0% { transform: translate(0); }
    10% { transform: translate(-8px, 5px); }
    20% { transform: translate(8px, -5px); }
    30% { transform: translate(-6px, -4px); }
    40% { transform: translate(6px, 4px); }
    50% { transform: translate(-4px, 0); }
    60% { transform: translate(4px, 0); }
    70% { transform: translate(-2px, 2px); }
    80% { transform: translate(2px, -2px); }
    90% { transform: translate(-1px, 1px); }
    100% { transform: translate(0); }
  }
</style>
</head>
<body>

<img id="pic" src="https://picsum.photos/id/237/536/354">

<script>
const pic = document.getElementById("pic");
let showingTruth = false;

pic.addEventListener("click", () => {
  pic.classList.add("glitch");

  setTimeout(() => {
    pic.src = showingTruth
      ? "https://picsum.photos/id/237/536/354"
      : "https://picsum.photos/seed/picsum/536/354";

    showingTruth = !showingTruth;
    pic.classList.remove("glitch");
  }, 500);
});
</script>

</body>
</html>
