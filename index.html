<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Image Swap</title>
  <style>
    img {
      max-width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

<img id="pic"
     src="https://picsum.photos/id/237/536/354"
     onclick="swap()">

<script>
function swap() {
  const pic = document.getElementById("pic");

  if (pic.src.includes("237/536/354")) {
    pic.src = "https://picsum.photos/seed/picsum/536/354";
  } else {
    pic.src = "https://picsum.photos/id/237/536/354";
  }
}
</script>

</body>
</html>
